name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" \
            | base64 --decode > /tmp/clanker-release.jks
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Run JVM tests
        run: ./gradlew :shared:jvmTest

      - name: Assemble release APK
        run: ./gradlew :composeApp:assembleRelease
        env:
          CLANKER_KEYSTORE: /tmp/clanker-release.jks
          CLANKER_KEYSTORE_PASSWORD: ${{ secrets.CLANKER_KEYSTORE_PASSWORD }}
          CLANKER_KEY_ALIAS: ${{ secrets.CLANKER_KEY_ALIAS }}
          CLANKER_KEY_PASSWORD: ${{ secrets.CLANKER_KEY_PASSWORD }}

      - name: semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release APK
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          gh release upload "${{ steps.semrel.outputs.new_release_version }}" \
            composeApp/build/outputs/apk/release/app-release.apk \
            --clobber \
            --repo "${{ github.repository }}" \
            --rename \
              "clanker-v${{ steps.semrel.outputs.new_release_version }}.apk"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
