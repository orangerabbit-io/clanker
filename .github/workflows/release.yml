name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" \
            | base64 --decode > /tmp/clanker-release.jks
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}

      - name: Run JVM tests
        run: ./gradlew :shared:jvmTest

      - name: semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble release APK
        if: steps.semrel.outputs.new_release_published == 'true'
        # versionCode is the total commit count: strictly monotonic across
        # releases (no force-push rewrites on main), and lets Android/Obtainium
        # order updates. versionName comes from the released tag.
        run: |
          VERSION_CODE="$(git rev-list --count HEAD)"
          ./gradlew :composeApp:assembleRelease \
            -PclankerVersionName="${{ steps.semrel.outputs.new_release_version }}" \
            -PclankerVersionCode="${VERSION_CODE}"
        env:
          CLANKER_KEYSTORE: /tmp/clanker-release.jks
          CLANKER_KEYSTORE_PASSWORD: ${{ secrets.CLANKER_KEYSTORE_PASSWORD }}
          CLANKER_KEY_ALIAS: ${{ secrets.CLANKER_KEY_ALIAS }}
          CLANKER_KEY_PASSWORD: ${{ secrets.CLANKER_KEY_PASSWORD }}

      - name: Upload release APK
        if: steps.semrel.outputs.new_release_published == 'true'
        run: |
          VER="${{ steps.semrel.outputs.new_release_version }}"
          APK_NAME="clanker-v${VER}.apk"
          # AGP 9.1.1: assembleRelease writes the APK to outputs/apk/release/<module>-release.apk
          # (module-scoped name). The intermediates redirect.txt is only the IDE pointer.
          cp composeApp/build/outputs/apk/release/composeApp-release.apk "${APK_NAME}"
          gh release upload \
            "${{ steps.semrel.outputs.new_release_tag }}" \
            "${APK_NAME}" \
            --clobber \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
