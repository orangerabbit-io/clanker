name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run JVM tests
        run: ./gradlew :shared:jvmTest

      - name: Assemble debug APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Locate APK (diagnostic)
        run: |
          find composeApp/build -name '*.apk' -o -name 'redirect.txt' | head -20
          echo '--- redirect.txt contents:'
          find composeApp/build -name 'redirect.txt' -exec cat {} \; | head -10

      - uses: actions/upload-artifact@v4
        with:
          name: clanker-debug-apk
          # AGP 9.1.1 places packaged APKs under build/intermediates/apk (SingleArtifact.APK is
          # INTERMEDIATES-category); build/outputs/apk/debug holds only the IDE redirect.txt.
          path: composeApp/build/intermediates/apk/debug/app-debug.apk
          if-no-files-found: error
